<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>IRMA Baitussalam · Kuis & Ranking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-wrapper">
    <!-- Header -->
    <header id="mainNavbar" class="app-header" style="display: none;">
      <div class="header-left">
        <div class="avatar-wrapper" id="profileTrigger">
          <img id="navAvatar" class="avatar" src="" alt="Profil" style="display:none;">
        </div>
        <span class="brand-title">IRMA Baitussalam</span>
      </div>
      <div class="nav-links">
        <button id="navHomeDesktop" class="nav-btn"><i class="ti ti-home"></i> Beranda</button>
        <a href="https://irmabaitussalam.github.io/kontak" class="nav-btn"><i class="ti ti-mail"></i> Kontak</a>
        <button id="toggleThemeDesktop" class="theme-toggle-btn"><i class="ti ti-moon"></i></button>
      </div>
      <button id="hamburgerBtn" class="hamburger-btn">
        <span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span>
      </button>
      <div id="profileDropdown" class="dropdown-menu profile-dropdown">
        <p style="font-weight:600; margin-bottom:8px;" id="profileName"></p>
        <button id="logoutBtnFromDropdown"><i class="ti ti-logout"></i> Keluar</button>
      </div>
      <div id="hamburgerDropdown" class="dropdown-menu hamburger-dropdown">
        <button id="navHomeMobile"><i class="ti ti-home"></i> Beranda</button>
        <a href="https://irmabaitussalam.github.io/kontak"><i class="ti ti-mail"></i> Kontak</a>
        <button id="toggleThemeMobile" class="theme-toggle-btn"><i class="ti ti-moon"></i></button>
      </div>
    </header>

    <!-- Login -->
    <div id="loginScreen" class="screen active">
      <div class="neu-card login-card">
        <i class="ti ti-book" style="font-size:3rem; color:var(--icon-color);"></i>
        <h2>Masuk ke IRMA Quiz</h2>
        <p style="color:var(--subtext1);">Gunakan akun Google</p>
        <div class="login-btn-wrapper">
          <button id="googleLoginBtn" class="nav-btn"><i class="ti ti-brand-google"></i> Masuk dengan Google</button>
        </div>
        <p class="login-footer-text">Dengan masuk, kamu setuju dengan ketentuan kuis IRMA Baitussalam</p>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardScreen" class="screen">
      <div class="search-wrapper">
        <i class="ti ti-search"></i>
        <input type="text" id="searchInput" placeholder="Cari kuis...">
      </div>
      <div class="section-title"><i class="ti ti-clipboard-list"></i> Kuis Terbaru</div>
      <div id="quizContainer" class="quiz-grid"></div>
      <div class="neu-card">
        <div class="section-title"><i class="ti ti-trophy"></i> Ranking Peserta</div>
        <ul id="leaderboardList" class="leaderboard-list"></ul>
        <div id="leaderboardEmpty" class="empty-message">Belum ada peserta</div>
      </div>
    </div>

    <!-- Kuis -->
    <div id="quizScreen" class="screen">
      <div class="neu-card" id="quizCard">
        <h2 id="quizTitle"></h2>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <p id="questionNumber" style="font-weight:600;"></p>
        <p id="questionText" style="margin:12px 0;"></p>
        <div id="optionsContainer"></div>
        <div class="quiz-navigation">
          <button id="prevQuestionBtn" class="icon-btn quiz-nav-btn"><i class="ti ti-arrow-left"></i> Sebelumnya</button>
          <button id="nextQuestionBtn" class="icon-btn quiz-nav-btn">Selanjutnya <i class="ti ti-arrow-right"></i></button>
        </div>
        <button id="submitQuizBtn" class="icon-btn submit-quiz-btn"><i class="ti ti-check"></i> Selesai & Lihat Skor</button>
      </div>
    </div>

    <!-- Hasil -->
    <div id="resultScreen" class="screen">
      <div class="neu-card" style="max-width:700px; margin:0 auto;">
        <div id="resultSummary" style="text-align:center;">
          <i class="ti ti-rosette" style="font-size:3rem; color:var(--icon-color);"></i>
          <h2>Kuis Selesai!</h2>
          <p style="font-size:1.2rem;">Skor kamu: <strong id="resultScore"></strong></p>
        </div>
        <div id="reviewContainer" style="margin-top:20px;"></div>
        <button id="backToHomeBtn" class="icon-btn back-home-btn"><i class="ti ti-home"></i> Kembali ke Beranda</button>
      </div>
    </div>

    <footer class="app-footer">2014–<span id="currentYear"></span> IRMA Baitussalam</footer>
  </div>

  <script src="data/quiz-loader.js"></script>
  <script src="theme.js"></script>
  <script src="script.js"></script>
</body>
</html>
